<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="viagem.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <title>TravelDreams - Contato</title>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
              <a class="navbar-brand" href="#">TravelDreams</a>
              <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
              </button>
              <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="home_viagens.html">Home</a>
                      </li>
                    <li class="nav-item">
                    <a class="nav-link" href="servicos.html">Viagens</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="sobre.html">Sobre</a>
                  </li>
                  <div class="btn-group" role="group" aria-label="Basic outlined example">
                    <button onclick="altenarContraste()" type="button" class="btn btn-outline-primary">Alternar Contraste</button>
                    <button onclick="diminuirFonte()" type="button" class="btn btn-outline-primary">Diminuir Fonte</button>
                    <button onclick="aumentarFonte()" type="button" class="btn btn-outline-primary">Aumentar Fonte</button>
                  </div>

                  <div>
                    <script>
                      function aumentarFonte() {
                      document.documentElement.style.fontSize = parseInt 
                      (getComputedStyle(document.documentElement).fontSize) + 1 + 'px'; }
                      function diminuirFonte() {
                      document.documentElement.style.fontSize = parseInt
                      (getComputedStyle(document.documentElement).fontSize) - 1 + 'px'; }
                    </script>
                     
                    <script>
                      function altenarContraste() {
                        document.body.classList.toggle('contraste');
                        }
                    </script>
                    
                    <div vw class="enabled">
                    <div vw-access-button class="active"></div>
                    <div vw-plugin-wrapper>
                    <div class="vw-plugin-top-wrapper"></div>
                    </div>
                    </div>
                    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
                    <script>
                      new window.VLibras.Widget('https://vlibras.gov.br/app');
                    </script>
                    
                </ul>
              </div>
            </div>
          </nav>
    </header>

    <main>
        <section class="container py-5">
            <h2 class="mb-4">Caso se interrese em Algum dos nossos servirços
                preencha o formulário abaixo
            </h2>
            <form method="post">
                <div class="row">
                    <div class="col">
                      <input type="text" class="form-control" placeholder="Primeiro nome" aria-label="Primerio nome" required>
                    </div>
                    <div class="col">
                      <input type="text" class="form-control" placeholder="Sobrenome" aria-label="Sobrenome" required>
                    </div>
                  </div>
                  <br>
                  <div class="col-md-6">
                    <input type="email" class="form-control" id="inputEmail4" placeholder="Email" required>
                  </div>
                  <br>
                  <div class="col-md-6">
                    <input type="num" class="form-control" id="number" placeholder="Telefone" required>
                  </div>
                  <br>
                  <div class="form-floating">
                    <select class="form-select" id="floatingSelect" aria-label="Floating label select example">
                      <option selected>Selecione o destino de interesse</option>
                      <option value="1">Natal</option>
                      <option value="2">Maceio</option>
                      <option value="3">Pernambuco</option>
                      <option value="4">Gramado</option>
                      <option value="5">Salvador</option>
                      <option value="6">Porto Seguro</option>
                    </select>
                    <label for="floatingSelect">Destino</label>
                  </div>
                  <br>
                  <div class="form-floating">
                    <textarea class="form-control" placeholder="Leave a comment here" id="floatingTextarea2" style="height: 100px"></textarea>
                    <label for="floatingTextarea2">Mensagem</label>
                  </div>
                  <br>
                  <div class="d-grid gap-2">
                    <button class="btn btn-primary" type="submit">Enviar</button>
                  </div>
            </form>
        </section>
    </main>
</body>
</html>
