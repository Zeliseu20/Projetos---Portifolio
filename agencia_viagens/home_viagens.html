<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="viagem.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <title>TravelDreams</title>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
              <a class="navbar-brand" href="#">TravelDreams</a>
              <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
              </button>
              <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                  <li class="nav-item">
                    <a class="nav-link" href="servicos.html">Viagens</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="contato.viagem.html">Contato</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="sobre.html">Sobre</a>
                  </li>
                  <div class="btn-group" role="group" aria-label="Basic outlined example">
                    <button onclick="altenarContraste()" type="button" class="btn btn-outline-primary">Alternar Contraste</button>
                    <button onclick="diminuirFonte()" type="button" class="btn btn-outline-primary">Diminuir Fonte</button>
                    <button onclick="aumentarFonte()" type="button" class="btn btn-outline-primary">Aumentar Fonte</button>
                  </div>

                  <div>
                    <script>
                      function aumentarFonte() {
                      document.documentElement.style.fontSize = parseInt 
                      (getComputedStyle(document.documentElement).fontSize) + 1 + 'px'; }
                      function diminuirFonte() {
                      document.documentElement.style.fontSize = parseInt
                      (getComputedStyle(document.documentElement).fontSize) - 1 + 'px'; }
                    </script>
                     
                    <script>
                      function altenarContraste() {
                        document.body.classList.toggle('contraste');
                        }
                    </script>
                    
                    <div vw class="enabled">
                    <div vw-access-button class="active"></div>
                    <div vw-plugin-wrapper>
                    <div class="vw-plugin-top-wrapper"></div>
                    </div>
                    </div>
                    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
                    <script>
                      new window.VLibras.Widget('https://vlibras.gov.br/app');
                    </script>
                    
                </ul>
              </div>
            </div>
          </nav>
    </header>
    
    <main>
        <section class="container">
            <h1 style="text-align: center;">Bem-vindo ao TravelDreams</h1>
            <p style="text-align: center;">Aqui você encontra as melhores viagens para o seu destino</p>

            <div id="carouselExampleFade" class="carousel slide carousel-fade">
                <div class="carousel-inner">
                  <div class="carousel-item active">
                    <img src="img/img1.jpg" class="d-block w-100" alt="imagem de praia">
                  </div>
                  <div class="carousel-item">
                    <img src="img/img2.jpg" class="d-block w-100" alt="imagem de praia">
                  </div>
                  <div class="carousel-item">
                    <img src="img/img3.jpg" class="d-block w-100" alt="imagem de praia">
                  </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleFade" data-bs-slide="prev">
                  <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                  <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleFade" data-bs-slide="next">
                  <span class="carousel-control-next-icon" aria-hidden="true"></span>
                  <span class="visually-hidden">Next</span>
                </button>
              </div>
        </section>
    </main>
    <footer>
        <p style="text-align: center;">Copyright 2026 TravelDreams</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
