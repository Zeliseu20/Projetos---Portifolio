</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg" style="background-color: #6d3610;">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                  <img src="img/sabor_img.webp" alt="Logo" width="99" height="27" class="d-inline-block align-text-top">

          </nav>
    </header>
    <main>
    <section class="container py-5">
            <h2 class="mb-4 text-center">Faça Sua Reserva!</h2>
            <form method="post">
                <div class="row">
                    <div class="col">
                      <input type="text" class="form-control" placeholder="Primeiro nome" aria-label="Primerio nome" required>
                    </div>
                    <div class="col">
                      <input type="text" class="form-control" placeholder="Sobrenome" aria-label="Sobrenome" required>
                    </div>
                  </div>
                  <br>
                  <div class="col-md-6">
                    <input type="email" class="form-control" id="inputEmail4" placeholder="Email" required>
                  </div>
                  <br>
                  <div class="col-md-6">
                    <input type="number" class="form-control" id="number" placeholder="Telefone" required>
                  </div>
                  <br>
                   <div class="form-floating">
                    <select class="form-select" id="floatingSelect" aria-label="Floating label select example">
                      <option selected>Datas Disponíveis</option>
                      <option value="1">20/06</option>
                      <option value="2">21/06</option>
                      <option value="3">22/06</option>
                      <option value="4">23/06</option>
                      <option value="5">24/06</option>
                      <option value="6">25/06</option>
                    </select>
                    <label for="floatingSelect">Datas Disponíveis</label>
                  </div>
                  <br>
                   <div class="form-floating">
                    <select class="form-select" id="floatingSelect" aria-label="Floating label select example">
                      <option selected>Horários Disponíveis</option>
                      <option value="1">11:00</option>
                      <option value="2">12:00</option>
                      <option value="3">13:00</option>
                      <option value="4">18:00</option>
                      <option value="5">21:00</option>
                    </select>
                    <label for="floatingSelect">Horários Disponíveis</label>
                  </div>
                  <br>
                  <div class="form-floating">
                    <textarea class="form-control" placeholder="Leave a comment here" id="floatingTextarea2" style="height: 100px"></textarea>
                    <label for="floatingTextarea2">Mensagem</label>
                  </div>
                  <br>
                  <div class="d-grid gap-2">
                    <button class="btn btn-primary" type="submit" style="background-color:#6d3610 ;">Enviar</button>
                  </div>
            </form>
        </section>
    </main>
    <footer>
      <p>Sabor & Arte - Todos os direitos reservados</p>
