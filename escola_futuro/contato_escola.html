<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="escola_gera_style.css">
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escola Gera</title>
</head>
<body>
     <header class="navbar-brand">
        <h1>Escola Gera</h1>
     </header>
     <section>
      <form>
        <div class="mb-3" >
         <label for="name" class="form-label">Nome Completo</label>
         <input type="name" class="form-control" id="InputName" required>
        </div>
      <div class="mb-3">
    <label for="Email" class="form-label">Email</label>
    <input type="email" class="form-control" id="InputEmail1" aria-describedby="emailHelp" required>
    <div id="emailHelp" class="form-text"></div>
  </div>
  <select class="form-select" aria-label="Default select example">
  <option selected>Selecione o curso</option>
  <option value="1">Desenvolvimento de Sistemas</option>
  <option value="2">Administração</option>
  <option value="3">Infomartica</option>
  <option value="4">Enfermagem</option>
  <option value="5">Mêcanica</option>
  <option value="6">Robotica</option>
</select>
  <div class="mb-3">
    <label for="mensagem" class="form-label">Mensagem</label>
    <input type="text" class="form-control" id="text">
  </div>
  <button type="submit">Enviar</button>
</form>
     </section>
