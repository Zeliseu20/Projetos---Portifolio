<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="escola_gera_style.css">
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escola Gera</title>
</head>
<body>
     <header class="navbar-brand">
        <h1>Escola Gera</h1>
     </header>
     <section>
      <form>
        <div class="mb-3" >
         <label for="name" class="form-label">Nome Completo</label>
         <input type="name" class="form-control" id="InputName" required>
        </div>
      <div class="mb-3">
    <label for="Email" class="form-label">Email</label>
    <input type="email" class="form-control" id="InputEmail1" aria-describedby="emailHelp" required>
    <div id="emailHelp" class="form-text"></div>
  </div>
  <select class="form-select" aria-label="Default select example">
  <option selected>Selecione o curso</option>
  <option value="1">Desenvolvimento de Sistemas</option>
  <option value="2">Administração</option>
  <option value="3">Infomartica</option>
  <option value="4">Enfermagem</option>
  <option value="5">Mêcanica</option>
  <option value="6">Robotica</option>
</select>
  <div class="mb-3">
    <label for="mensagem" class="form-label">Mensagem</label>
    <input type="text" class="form-control" id="text">
  </div>
  <div class="mb-3"">
  <button type="submit" class="btn btn-primary" style="margin: auto; display: block;">Enviar</button>
  </div>
</form>
    </section>
    <footer>
    <div>
    <button class="btn btn-light" style="margin: auto; display: block;" onclick="window.location.href='escola_gera_home.html'">Voltar para a página inicial</button>
    <br>
    <button class="btn btn-light" style="margin: auto; display: block;" onclick="window.location.href='cursos_escola.html'">Ver cursos</button>
     <br><br><br>
    </div>

        <div class="div_a">
        <button class="btn btn-light" style="margin: auto; display: block;" onclick="altenarContraste()">Alternar modo alto contraste</button>
        <br><br>
        <button class="btn btn-light" style="margin: auto; display: block;" onclick="aumentarFonte()">Aumentar Fonte</button>
        <br><br>
        <button class="btn btn-light" style="margin: auto; display: block;" onclick="diminuirFonte()">Diminuir Fonte</button>
        <br><br>
        <div>
            <script>
                function aumentarFonte() {
                    document.documentElement.style.fontSize = parseInt
                    (getComputedStyle(document.documentElement).fontSize) + 1 + 'px'; }
                function diminuirFonte() {
                    document.documentElement.style.fontSize = parseInt
                    (getComputedStyle(document.documentElement).fontSize) - 1 + 'px'; }
                </script>
                <script>
                    function altenarContraste() {
                        document.body.classList.toggle('contraste');
                    }
                </script>
            </div>
        </div>
        <div vw class="enabled">
            <div vw-access-button class="active"></div>
            <div vw-plugin-wrapper>
                <div class="vw-plugin-top-wrapper"></div>
            </div>
        </div>
        <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
        <script>
            new window.VLibras.Widget('https://vlibras.gov.br/app');
        </script>
        </div>
        
    </footer>
</body>
</html>
